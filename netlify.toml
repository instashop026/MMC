[build]
  base = "artifacts/model-feed"
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Secret Scanning — only these public Supabase client config values
# are intentionally embedded in the browser bundle. The real secrets
# (SUPABASE_SERVICE_ROLE_KEY, ZEROSTORAGE_API_KEY) are still protected.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY"
